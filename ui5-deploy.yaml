# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zbreeder
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS4-100
          url: http://sapdev.sap.tanmiah.com:443
          client: '100'
        app:
          name: ZBREEDER
          description: Breeder
          package: ZBP
          transport: DS4K901372
        exclude:
          - /test/
          - /localService/
